name: Supabase Keep-Alive

# Pings the DWC Supabase project every 3 days so it never goes 7 days
# without activity, which is when Supabase pauses free-tier projects.

on:
  schedule:
    - cron: '0 6 */3 * *'   # 06:00 UTC, every 3rd day
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase workshop_state table
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            "${SUPABASE_URL}/rest/v1/workshop_state?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
